name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Repository structure, links, pack contracts, fixtures, research provenance
        run: python3 scripts/validate.py
      - name: Source index is current
        run: python3 scripts/build_source_index.py --check
