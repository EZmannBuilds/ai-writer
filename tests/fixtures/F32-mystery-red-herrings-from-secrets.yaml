# AI Writer behavioral fixture. See tests/README.md.
id: F32
title: Red herrings come from suspects' real secrets
covers:
- packs/mystery
- core/character-model
input:
  request: 'Mystery: build the suspect list for the lighthouse case — four suspects, each with a reason
    to look guilty.'
  context:
    state: context
    canon: 'Approved truth model: the assistant keeper Wren killed the head keeper Aldous during the evening
      watch, leaving by the external gallery and re-entering through the service hatch; Aldous had bolted
      the lamp-room door from inside because he heard someone on the gallery. Motive: Aldous planned to
      automate the light, ending both their posts. Nobody else knows.'
expected:
  route:
    task: mystery
    stage: planning
    mode:
    - SHORT_STORY
    - LONG_FORM
    packs:
    - mystery
  behavior:
  - Gives each suspect motive, means, opportunity, known facts, hidden facts, and lies.
  - Grounds each innocent suspect's suspicious behavior in a real unrelated secret.
  - Keeps the culprit's hidden facts consistent with the truth model.
failure:
- Innocent suspects act suspicious for no reason.
- Suspect knowledge contradicts the truth model.
- Invented facts are labeled approved or confirmed.
pass_criteria:
- Four suspect_state records with the listed fields.
- Each innocent suspect has a secret that explains their suspicious behavior.
- No suspect knows something the truth model says they couldn't.
- Nothing the response invents is presented as approved or confirmed canon; only the supplied truth model
  is treated as approved.
