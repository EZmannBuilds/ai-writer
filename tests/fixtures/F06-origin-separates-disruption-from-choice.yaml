# AI Writer behavioral fixture. See tests/README.md.
id: F06
title: Origin Forge separates the disruptive event from the villain-defining choice
covers:
- packs/origin-forge
input:
  request: 'Start Origin: a firefighter whose crew died in a warehouse fire becomes a supervillain. You
    decide the details.'
  context:
    state: none
expected:
  route:
    task: origin
    stage: seed
    mode: SHORT_STORY
    packs:
    - draft-starter
    - origin-forge
    authority: autonomous
  behavior:
  - The fire explains pressure but does not by itself make them a villain.
  - A later second test offers a real, less harmful alternative.
  - The villain turn is a deliberate chosen crossing that rejects that alternative.
  - Actual, perceived, and institutional responsibility for the fire are distinguished.
failure:
- The fire itself is the villain turn ('the tragedy made them evil').
- The crossing has no available alternative.
- Trauma or a diagnosis is the causal explanation for villainy.
pass_criteria:
- The Origin Brief (or plan) has a distinct second test and chosen crossing, separate from the disruption.
- At least one rejected alternative is named.
- Responsibility is split into at least two of actual / perceived / institutional.
- No text uses trauma or mental illness as the cause of their harmful choices.
